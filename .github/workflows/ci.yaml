name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint add-on files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint YAML files
        run: yamllint --strict .

      - name: Check Bash syntax
        run: bash -n joulo_ocpp_proxy/run.sh

      - name: Lint Bash script
        run: shellcheck --shell=bash joulo_ocpp_proxy/run.sh

  build:
    name: Build (${{ matrix.architecture }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
          - architecture: aarch64
            platform: linux/arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build add-on image
        uses: docker/build-push-action@v7
        with:
          context: ./joulo_ocpp_proxy
          platforms: ${{ matrix.platform }}
          pull: true
          push: false
          cache-from: type=gha,scope=joulo-ocpp-proxy-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=joulo-ocpp-proxy-${{ matrix.architecture }}
